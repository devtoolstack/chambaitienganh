<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Grid overlay pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)" />
  </g>

  <!-- Ambient glowing circles -->
  <circle cx="200" cy="150" r="220" fill="#6366f1" opacity="0.15" filter="blur(40px)" />
  <circle cx="1000" cy="450" r="260" fill="#a855f7" opacity="0.2" filter="blur(50px)" />

  <!-- Left Side: App Branding -->
  <g transform="translate(80, 100)">
    <!-- Logo Icon -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="68" height="68" rx="20" fill="url(#accentGrad)" filter="url(#shadow)" />
      <!-- Graduation Cap & Sparkles SVG -->
      <path d="M 18 34 L 34 24 L 50 34 L 34 44 Z M 22 38 V 46 C 22 50, 46 50, 46 46 V 38" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 50 34 V 46" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Tagline Badge -->
    <g transform="translate(88, 16)">
      <rect x="0" y="0" width="220" height="34" rx="17" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" />
      <text x="16" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="13" fill="#a5b4fc">✨ AI SMART GRADING</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="46" fill="#ffffff">
      Chấm Bài Tiếng Anh AI
    </text>

    <!-- Subtitle -->
    <text x="0" y="195" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="20" fill="#cbd5e1" width="480">
      Hệ thống tự động chấm bài luận, phân tích Rubric
    </text>
    <text x="0" y="225" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="20" fill="#cbd5e1">
      và phát hiện trùng lặp văn bản chuyên nghiệp
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 270)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="42" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.4" />
      <text x="18" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#e0e7ff">🎯 Rubric Standard</text>

      <!-- Pill 2 -->
      <rect x="172" y="0" width="165" height="42" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.4" />
      <text x="190" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#e0e7ff">🔍 Check Đạo Văn</text>

      <!-- Pill 3 -->
      <rect x="349" y="0" width="165" height="42" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.4" />
      <text x="367" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#e0e7ff">⚡ Phản Hồi Tức Thì</text>
    </g>
  </g>

  <!-- Right Side: Mock UI Card Display -->
  <g transform="translate(640, 75)" filter="url(#shadow)">
    <!-- Main Card Body -->
    <rect x="0" y="0" width="480" height="480" rx="24" fill="url(#cardGrad)" />

    <!-- Card Header -->
    <rect x="0" y="0" width="480" height="70" rx="24" fill="#f1f5f9" />
    <circle cx="30" cy="35" r="7" fill="#ef4444" />
    <circle cx="50" cy="35" r="7" fill="#f59e0b" />
    <circle cx="70" cy="35" r="7" fill="#10b981" />
    <text x="95" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15" fill="#334155">Essay Evaluation &amp; Rubric Feedback</text>

    <!-- Score Badge Floating -->
    <g transform="translate(320, 95)">
      <rect x="0" y="0" width="130" height="90" rx="18" fill="url(#accentGrad)" />
      <text x="65" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="32" fill="#ffffff" text-anchor="middle">9.2 / 10</text>
      <text x="65" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#c7d2fe" text-anchor="middle">EXCELLENT (A+)</text>
    </g>

    <!-- Student & Essay Info -->
    <g transform="translate(30, 95)">
      <text x="0" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#0f172a">IELTS Writing Task 2</text>
      <text x="0" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#64748b">Sinh viên: Nguyễn Văn A (ENG201)</text>
      <text x="0" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="12" fill="#10b981">✓ Đã kiểm tra trùng lặp: 4% (An toàn)</text>
    </g>

    <!-- Rubric Breakdown Bars -->
    <g transform="translate(30, 210)">
      <!-- Item 1 -->
      <text x="0" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#334155">Task Response (25%)</text>
      <text x="390" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#4f46e5">2.4 / 2.5</text>
      <rect x="0" y="25" width="420" height="8" rx="4" fill="#e2e8f0" />
      <rect x="0" y="25" width="400" height="8" rx="4" fill="#4f46e5" />

      <!-- Item 2 -->
      <text x="0" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#334155">Coherence &amp; Cohesion (25%)</text>
      <text x="390" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#4f46e5">2.3 / 2.5</text>
      <rect x="0" y="70" width="420" height="8" rx="4" fill="#e2e8f0" />
      <rect x="0" y="70" width="385" height="8" rx="4" fill="#6366f1" />

      <!-- Item 3 -->
      <text x="0" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#334155">Lexical Resource (25%)</text>
      <text x="390" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#4f46e5">2.2 / 2.5</text>
      <rect x="0" y="115" width="420" height="8" rx="4" fill="#e2e8f0" />
      <rect x="0" y="115" width="370" height="8" rx="4" fill="#8b5cf6" />

      <!-- Item 4 -->
      <text x="0" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#334155">Grammatical Accuracy (25%)</text>
      <text x="390" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#4f46e5">2.3 / 2.5</text>
      <rect x="0" y="160" width="420" height="8" rx="4" fill="#e2e8f0" />
      <rect x="0" y="160" width="385" height="8" rx="4" fill="#a855f7" />
    </g>

    <!-- AI Feedback Box -->
    <g transform="translate(30, 400)">
      <rect x="0" y="0" width="420" height="52" rx="12" fill="#f0fdf4" stroke="#bbf7d0" />
      <text x="16" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#166534">💡 Nhận xét AI:</text>
      <text x="16" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#15803d">Bài viết phát triển ý mạch lạc, vốn từ vựng phong phú, sử dụng tốt các từ nối.</text>
    </g>
  </g>
</svg>
